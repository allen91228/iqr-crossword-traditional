{a:'反革命分子',d:'down',r:5,c:4,q:'中國在特定歷史時期被定性為蓄意顛覆紅色政權者的統稱，曾列為刑法重罪。'},
];
const N=13, board=document.querySelector('#board'), cells={}, words={}, filled={}; let selected=0, started=Date.now(), classic=false, hintsUsed=0, finished=false, attempts={}, hintedEntries={}; const CACHE_KEY='iqr-crossword-d9yqsl6e-v5';
const traditionalMap={'红':'紅','国':'國','宪':'憲','个':'個','现':'現','体':'體','户':'戶','运':'運','动':'動','墙':'牆','跃':'躍','进':'進','输':'輸','队':'隊','长':'長','鸣':'鳴','学':'學','员':'員','画':'畫','农':'農','审':'審','级':'級','军':'軍','产':'產','华':'華'};
function normalizeAnswer(value){return value.replace(/\s/g,'').split('').map(ch=>traditionalMap[ch]||ch).join('')}
entries.forEach((e,i)=>{e.id=i;words[i]=[];for(let k=0;k<e.a.length;k++){let r=e.r+(e.d==='down'?k:0),c=e.c+(e.d==='across'?k:0);let key=r+'-'+c;if(!cells[key])cells[key]={r,c,entries:[],answer:e.a[k]};cells[key].entries.push(i);words[i].push(key)}});
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({filled,selected,started,hintsUsed,attempts,hintedEntries}))}catch(e){}}
function restoreCache(){try{let raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;let data=JSON.parse(raw);if(data&&data.filled&&typeof data.filled==='object'){Object.assign(filled,data.filled);Object.assign(attempts,data.attempts||{});Object.assign(hintedEntries,data.hintedEntries||{});selected=Number.isInteger(data.selected)&&data.selected>=0&&data.selected<entries.length?data.selected:0;started=Number.isFinite(data.started)?data.started:Date.now();hintsUsed=Number.isFinite(data.hintsUsed)?data.hintsUsed:0;return true}}catch(e){}return false}
const restoredCache=restoreCache();
function renderBoard(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let key=r+'-'+c, x=cells[key], b=document.createElement('button');b.className='cell '+(x?'':'block');b.type='button';b.dataset.key=key;if(x){if(x.entries.includes(selected))b.classList.add('selected');else if(x.entries.some(i=>i===selected))b.classList.add('related');if(filled[key]){b.classList.add('filled');b.innerHTML='<span class="char">'+filled[key]+'</span>'}b.addEventListener('click',()=>selectCell(key));}board.appendChild(b)}}
function selectCell(key){let x=cells[key];if(!x)return;let idx=x.entries.indexOf(selected);selected=x.entries[idx<0?0:(idx+1)%x.entries.length];update();document.querySelector('#answer').focus()}
function update(){let e=entries[selected];document.querySelector('#clueNo').textContent='線索 '+(selected+1);document.querySelector('#clueText').textContent=e.q;document.querySelector('#answer').value=entries[selected].a.split('').map((_,k)=>filled[words[selected][k]]||'').join('');saveCache();renderBoard();document.querySelectorAll('.clue-item').forEach((n,i)=>n.classList.toggle('active',i===selected));}
function solved(i){return words[i].every(k=>filled[k]===cells[k].answer)}function completed(){return entries.filter((_,i)=>solved(i)).length}
function msg(t,kind=''){let s=document.querySelector('#status');s.textContent=t;s.className='status '+kind;}
function refreshProgress(){let n=completed(),p=Math.round(n/entries.length*100);document.querySelector('#done').textContent=p+'%';document.querySelector('#solvedCount').textContent=n+' / '+entries.length+' 題';document.querySelector('#meter').style.width=p+'%';document.querySelectorAll('.clue-item').forEach((n,i)=>n.classList.toggle('done',solved(i)))}
function reveal(){let e=entries[selected],idx=words[selected].findIndex(k=>!filled[k]);if(idx<0){msg('');return}hintsUsed++;hintedEntries[selected]=true;let k=words[selected][idx];filled[k]=cells[k].answer;msg('已揭示第 '+(idx+1)+' 個字。','ok');update();refreshProgress();saveCache();if(gridComplete()||completed()===entries.length){showToast('恭喜完成整張填字！');showResult()}}
function formatTime(seconds){let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');return m+':'+s}
function gridComplete(){return Object.keys(cells).every(k=>filled[k])}
function oneShotCount(){return entries.filter((e,i)=>solved(i)&&attempts[i]===1&&!hintedEntries[i]).length}
function showResult(){if(finished)return;finished=true;let elapsed=Math.floor((Date.now()-started)/1000),oneShot=oneShotCount(),accuracy=oneShot/entries.length,speed=Math.max(0,1-elapsed/600),hintDiscipline=Math.max(0,1-hintsUsed/(entries.length*1.5)),score=Math.max(0,Math.min(100,Math.round(100*(accuracy*.55+speed*.3+hintDiscipline*.15)))),title,detail;if(oneShot===0){title='你是中華民族的敏感字迴避大師';detail='你成功避開了所有的敏感字，這代表你十分了解那些不能說的字背後的故事。你污辱了偉大的中華民族。'}else if(score>=92){title='你是中華民族偉大復興的接班人';detail='你一次命中的速度快到像是早已看過標準答案，請立即提交三份思想報告證明自己沒有想太多。'}else if(score>=78){title='你是中華民族中流砥柱的螺絲釘';detail='你在正確與可控之間取得了完美平衡，連錯誤都顯得非常有秩序。'}else if(score>=62){title='你是中華民族的自我審查小能手';detail='你偶爾說出了可以說的字，距離安全的偉大敘事只差一份自我檢查表。'}else if(score>=45){title='你是中華民族的人民公社優秀社員';detail='你與答案擦身而過，卻成功通過了審查。這種穩定的錯誤值得表揚。'}else{title='你是中華民族的歷史長河註腳';detail='你沒有完全答對，但你忠實維護了沉默，歷史因此鬆了一口氣。'}document.querySelector('#resultCorrect').textContent=oneShot+' / '+entries.length;document.querySelector('#resultTime').textContent=formatTime(elapsed);document.querySelector('#resultScore').textContent=score;document.querySelector('#rankText').textContent=title;document.querySelector('#rankDetail').textContent=detail;let modal=document.querySelector('#resultModal');modal.classList.add('show');modal.setAttribute('aria-hidden','false');document.querySelector('#again').focus()}
function submit(){let e=entries[selected], val=normalizeAnswer(document.querySelector('#answer').value);if(!val){msg('請先輸入答案。');return}attempts[selected]=(attempts[selected]||0)+1;saveCache();if(val===e.a){words[selected].forEach((k,i)=>filled[k]=e.a[i]);msg('答對了！交叉格已同步。','ok');update();refreshProgress();if(gridComplete()||completed()===entries.length){showToast('恭喜完成整張填字！');showResult()}}else{let bar=document.querySelector('.answer-bar');bar.classList.remove('shake');void bar.offsetWidth;bar.classList.add('shake');bar.addEventListener('animationend',()=>bar.classList.remove('shake'),{once:true});msg('答案不正確，再試一次。','bad')}}
function showToast(t){let n=document.querySelector('#toast');n.textContent=t;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2600)}
function selectEntry(i){selected=i;update();document.querySelector('#answer').focus()}
entries.forEach((e,i)=>{let n=document.createElement('button');n.className='clue-item';n.innerHTML='<small>線索 '+(i+1)+'</small>'+e.q;n.addEventListener('click',()=>selectEntry(i));document.querySelector('#clues').appendChild(n)});
document.querySelector('#submit').addEventListener('click',submit);document.querySelector('#hint').addEventListener('click',reveal);document.querySelector('#next').addEventListener('click',()=>selectEntry((selected+1)%entries.length));document.querySelector('#prev').addEventListener('click',()=>selectEntry((selected-1+entries.length)%entries.length));document.querySelector('#answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});document.querySelector('#share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);showToast('連結已複製')}catch{showToast('請從瀏覽器網址列分享')}});
document.querySelector('#resultClose').addEventListener('click',()=>{document.querySelector('#resultModal').classList.remove('show');document.querySelector('#resultModal').setAttribute('aria-hidden','true')});document.querySelector('#again').addEventListener('click',()=>{try{localStorage.removeItem(CACHE_KEY)}catch(e){}location.reload()});
setInterval(()=>{let s=Math.floor((Date.now()-started)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');document.querySelector('#timer').textContent=m+':'+x},1000);update();refreshProgress();if(restoredCache&&Object.keys(filled).length){showToast('已恢復上次進度');if(gridComplete()||completed()===entries.length)showResult()}
</script>
</body></html>
